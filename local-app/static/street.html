<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NearMind Street</title>
<meta name="description" content="Six neighbors, one robot on the roof. Watch NearMind route every favor in real time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='8' width='20' height='14' rx='5' fill='%23e9f6fb' stroke='%231f6f9e' stroke-width='2'/%3E%3Ccircle cx='12' cy='15' r='2.5' fill='%231f6f9e'/%3E%3Ccircle cx='20' cy='15' r='2.5' fill='%231f6f9e'/%3E%3Cpath d='M10 8L8 3M22 8l2-5' stroke='%231f6f9e' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/street.css?v=3">
</head><body>
<header class="bar">
  <a class="brand" href="/" aria-label="NearMind Street home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="11" width="26" height="18" rx="7" fill="#e9f6fb" stroke="#1f6f9e" stroke-width="2.5"/><circle cx="15" cy="20" r="3.2" fill="#1f6f9e"/><circle cx="25" cy="20" r="3.2" fill="#1f6f9e"/><path d="M12 11 9 4M28 11l3-7" stroke="#1f6f9e" stroke-width="2.5" stroke-linecap="round"/><circle cx="9" cy="4" r="2.4" fill="#35d6a4"/><circle cx="31" cy="4" r="2.4" fill="#35d6a4"/></svg>
    <span><b>Near<i>Mind</i></b> Street<small>six neighbors · one robot on the roof</small></span>
  </a>
  <div class="clock" role="group" aria-label="Time of day">
    <button class="chip on" data-clk="">Now</button><button class="chip" data-clk="08:30">Morning</button><button class="chip" data-clk="13:00">Midday</button><button class="chip" data-clk="19:30">Evening</button><button class="chip" data-clk="02:00">2 AM</button>
  </div>
  <div class="acts">
    <button class="btn ghost" id="speed" title="Playback speed" aria-label="Playback speed 1x">1×</button>
    <button class="btn ghost" id="thm" title="Switch theme">🌙</button>
    <button class="btn" id="reset" title="Clear the street and start over">↺ Reset</button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Building">
    <div id="scene" class="scene"></div>
    <p class="tip">Tap an apartment to ask as that neighbor · every bubble is one message passing through the robot</p>
  </section>

  <aside class="side">
    <div class="card demo-card">
      <h2>Watch a demo</h2>
      <div class="demos" id="demos"></div>
    </div>

    <div class="card ask">
      <div class="ask-h"><h2>Who</h2><div class="mode" id="mode" role="group" aria-label="Ask or sell"><button type="button" data-mode="ask" aria-pressed="true">Ask</button><button type="button" data-mode="sell" aria-pressed="false">Sell</button></div></div>
      <div class="who" id="who" role="radiogroup" aria-label="Who is asking"></div>
      <form id="f" class="compose">
        <textarea id="in" rows="2" maxlength="400" placeholder="e.g. I need someone to watch a movie with me tonight" aria-label="Request"></textarea>
        <button class="send" id="go" type="submit" aria-label="Send request">Send ➤</button>
      </form>
      <div class="quick" id="quick" aria-live="polite"></div>
      <div class="presets" id="presets"></div>
    </div>

    <div class="card feed">
      <div class="feed-h"><h2>Live timeline</h2><span class="phase" id="phase">Waiting for a request</span></div>
      <ol id="log" aria-live="polite"><li class="empty">Pick a neighbor, type a request and watch NearMind route it.</li></ol>
    </div>

    <div class="card wa" title="Everyone on this street is a model. When WhatsApp is on, the same robot reaches real neighbors.">
      <div class="wa-h"><span class="wa-ico">💬</span><b>WhatsApp</b><span class="off">Off for now</span><label class="sw"><input type="checkbox" disabled aria-label="WhatsApp off"><span></span></label></div>
    </div>
  </aside>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="/static/street-scene.js?v=5"></script>
<script src="/static/street-ui.js?v=4"></script>
</body></html>
