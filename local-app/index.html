<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NearMind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f3d31' stroke='%2335d6a4' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2335d6a4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css?v=13">
</head><body>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#0f3d31" stroke="#35d6a4" stroke-width="2"/><circle cx="9" cy="20" r="3" fill="#35d6a4"/><circle cx="23" cy="20" r="3" fill="#35d6a4"/><circle cx="16" cy="10" r="3" fill="#35d6a4"/><path d="M16 10L9 20M16 10L23 20M9 20H23" stroke="#35d6a4" stroke-width="1.4" fill="none" opacity=".6"/></svg>
    <div>Near<i>Mind</i><small>the agent that makes neighbors neighborly</small></div>
  </div>
  <div class="seg" id="modes"><button class="on" data-m="show">Showcase</button><button data-m="play">Live</button></div>
  <div class="ctx" id="ctx"></div>
  <div class="right">
    <button class="btn ghost" id="thm" title="Switch theme">🌙</button>
    <button class="btn ghost" id="snd" title="Message sounds">🔔</button>
    <button class="btn" id="vw" style="display:none"></button>
    <button class="btn" id="nw" style="display:none" title="Start a new request (NearMind keeps what it learned)">＋ New request</button>
    <button class="btn ghost" id="rw" style="display:none" title="Forget everything: memory, ledger, history">Reset world</button>
    <button class="btn" id="wab" style="display:none"></button>
    <div class="right" id="ctl">
      <button class="btn" id="pp">Pause</button><button class="btn" id="step">Step</button><button class="btn" id="sp">1x</button><button class="btn" id="re">Replay</button>
    </div>
  </div>
  <div id="wap" class="wap"></div>
</header>
<div id="llmw" role="status">Live mode needs an OpenAI key: add <code>OPENAI_API_KEY</code> to <code>.env</code> and restart the server. Showcase works without it.</div>
<div id="net">Server offline — reconnecting…</div>
<div class="prog"><i id="bar"></i></div>
<div class="pipe" id="pipe"></div>
<main class="grid" id="grid"></main>
<nav class="mtabs" id="mtabs"></nav>
<div class="cr">Made by Legion</div>
<script src="/static/apt.js?v=2"></script>
<script src="/static/app.js?v=21"></script>
</body></html>
